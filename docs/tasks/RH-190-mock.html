<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RH-190 — Custom fields arrive with the song</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 p-4 text-gray-900">
  <header class="max-w-4xl mx-auto mb-4">
    <h1 class="text-lg font-semibold">RH-190 — Custom fields arrive with the song</h1>
    <p class="text-sm text-gray-600">Slowed down so the difference is visible. Nothing about the section's look changes, only when it appears.</p>
    <div class="mt-3 flex flex-wrap gap-2">
      <button id="replay-open" type="button" class="rounded-md bg-emerald-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-emerald-700">
        <i data-lucide="play" class="inline h-4 w-4"></i> Open the song
      </button>
      <button id="replay-next" type="button" class="rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm font-medium hover:bg-gray-50">
        <i data-lucide="skip-forward" class="inline h-4 w-4"></i> Next in setlist
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto grid gap-4 md:grid-cols-2">
    <section>
      <h2 class="mb-2 text-sm font-semibold text-gray-700">Today</h2>
      <div id="pane-today" class="min-h-[280px] rounded-lg border border-gray-200 bg-gray-50 p-4"></div>
    </section>
    <section>
      <h2 class="mb-2 text-sm font-semibold text-emerald-700">After RH-190</h2>
      <div id="pane-after" class="min-h-[280px] rounded-lg border border-emerald-300 bg-gray-50 p-4"></div>
    </section>
  </main>

  <script>
    var SONGS = [
      { title: 'Sultans of Swing', artist: 'Dire Straits', tuning: 'Standard', fields: [{ name: 'Preset', value: 'Clean 12' }, { name: 'Capo', value: null }] },
      { title: 'Comfortably Numb', artist: 'Pink Floyd', tuning: 'Standard', fields: [{ name: 'Preset', value: 'Lead 3' }, { name: 'Capo', value: null }] }
    ];
    var current = 0;
    var timers = [];
    var BUTTON = 'rounded-md border border-gray-300 px-2 py-1 text-sm text-gray-700';

    function loadingHtml() {
      return '<p class="text-sm text-gray-500">Loading…</p>';
    }

    function fieldsHtml(song) {
      return '<div class="mt-2 flex flex-col gap-1.5" aria-label="Custom fields">' + song.fields.map(function (field) {
        var value = field.value ? '<span>' + field.value + '</span>' : '<span class="text-gray-400 italic">Not set</span>';
        return '<p class="text-sm text-gray-600 flex items-center gap-2"><span class="font-medium">' + field.name + ':</span> ' + value +
          ' <button type="button" class="' + BUTTON + '">' + (field.value ? 'Edit' : 'Set') + '</button></p>';
      }).join('') + '</div>';
    }

    function songHtml(song, withFields) {
      return '<p class="text-sm font-medium text-emerald-600">&larr; Back</p>' +
        '<h3 class="mt-3 text-xl font-bold">' + song.title + '</h3>' +
        '<p class="text-sm text-gray-500">' + song.artist + ' · Tuning: ' + song.tuning + '</p>' +
        (withFields ? fieldsHtml(song) : '') +
        '<div class="mt-4 rounded-md border border-gray-200 bg-white p-3 text-sm text-gray-500">Charts, links and lyrics…</div>';
    }

    function clearTimers() {
      timers.forEach(clearTimeout);
      timers = [];
    }

    function at(ms, fn) {
      timers.push(setTimeout(fn, ms));
    }

    function replayOpen() {
      var song = SONGS[current];
      var today = document.getElementById('pane-today');
      var after = document.getElementById('pane-after');
      clearTimers();
      today.innerHTML = loadingHtml();
      after.innerHTML = loadingHtml();
      at(700, function () {
        today.innerHTML = songHtml(song, false);
        after.innerHTML = songHtml(song, true);
      });
      at(1800, function () { today.innerHTML = songHtml(song, true); });
    }

    function replayNext() {
      var song;
      current = (current + 1) % SONGS.length;
      song = SONGS[current];
      clearTimers();
      document.getElementById('pane-today').innerHTML = songHtml(song, false);
      document.getElementById('pane-after').innerHTML = songHtml(song, true);
      at(1100, function () { document.getElementById('pane-today').innerHTML = songHtml(song, true); });
    }

    document.getElementById('replay-open').addEventListener('click', replayOpen);
    document.getElementById('replay-next').addEventListener('click', replayNext);
    if (window.lucide) window.lucide.createIcons();
    replayOpen();
  </script>
</body>
</html>
