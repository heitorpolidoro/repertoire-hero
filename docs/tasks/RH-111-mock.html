<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RH-111 mock</title>
<script src="https://cdn.tailwindcss.com"></script></head>

   <li><span class="text-amber-400">Replaced</span> · Key — another correction was chosen instead</li></ul></div>

  <ul class="mt-1 text-xs"><li><span class="text-emerald-400">Approved</span> · Artist</li></ul></div>
 <button onclick="document.getElementById('banner').remove()" class="rounded-lg bg-sky-600 px-3 py-1.5 text-xs font-semibold">Got it</button>
</div>
<div class="rounded-xl bg-slate-800 p-4 text-sm text-slate-400">Repertoire list...</div>
