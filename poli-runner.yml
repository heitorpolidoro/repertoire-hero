name: repertoire_hero
alias: rh
description: Repertoire Hero — Next.js repertoire manager for musicians and bands (:3000)

commands:
  # ensure-db.sh creates `repertoire_hero` on the shared Postgres and migrates it —
  # nothing else does, because the bundled first-boot entrypoint never runs there.
  # It exits 0 with a notice when the shared server is down, so `--no-deps` still
  # falls through to the bundled standalone database.
  # `--wait` (not a bare `up -d`) because the app declares a healthcheck: it returns
  # only once `/` actually answers, so `poli-runner status` is not racing the boot.
  start: ./scripts/ensure-db.sh && docker compose up -d --wait
  stop:  docker compose stop
  logs:  docker compose logs $FOLLOW --tail=200
  status:
    # The home route is a client component, so it renders 200 without a session.
    url: http://localhost:3000/
    timeout_secs: 600

# Pull the shared Postgres into the run, so `start repertoire_hero` wires to it by
# default. `start repertoire_hero --no-deps` leaves it out and the repo falls back to
# its own bundled database.
depends_on: [postgres]

integrations:
  postgres:
    description: Shared dev Postgres (:54321)
    # No `mock` scenario on purpose: when postgres is not in the run the runner injects
    # nothing, .env applies, and docker-compose.yml starts this repo's own database.
    local:
      COMPOSE_PROFILES: poli-runner    # no service declares it → the bundled one stays down
      # The shared cluster hosts many apps, so it cannot use the `postgres` database
      # the standalone mode uses; this repo owns `repertoire_hero` there.
      POSTGRES_URL: postgresql://postgres:postgres@host.docker.internal:54321/repertoire_hero
