name: repertoire-hero

# Local development stack: Postgres plus the app.
#
# `cp .env.example .env` is step one: Compose reads .env in every subcommand (up, stop,
# down), so the file has to exist for any of them to behave.
#
# The connection variable is POSTGRES_URL, not DATABASE_URL, on purpose: the host-side
# tooling (scripts/migrate.mjs, scripts/deduplicate-songs.mjs, vitest.config.ts) reads
# DATABASE_URL from .env.local, and a compose-network host (postgres:5432) under that name
# would be ambiguous. `app` maps it in as DATABASE_URL=${POSTGRES_URL}.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      # 54322 is the repository default: vitest.config.ts falls back to it and AGENTS.md
      # documents it. Override POSTGRES_PORT when the host port is already taken.
      - "${POSTGRES_PORT:-54322}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d/migrations:ro
      # Mounted outside /docker-entrypoint-initdb.d/ deliberately — see
      # docker/init-migrations.sh for why an initdb `*.sql` would break first boot.
      - ./scripts/seed-catalog.sql:/seed/catalog.sql:ro
      - ./docker/init-migrations.sh:/docker-entrypoint-initdb.d/99-migrations.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:                            # no profile: always starts, always stops
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # `docker compose up` working even before `cp .env.example .env`.
      - DATABASE_URL=${POSTGRES_URL:-postgresql://postgres:postgres@postgres:5432/postgres}
      # Next.js's standalone server binds to $HOSTNAME, which Docker sets to the
      # container id — so without this it listens on the container's own name only
      # and a loopback healthcheck (and `docker exec … wget 127.0.0.1`) is refused.
      - HOSTNAME=0.0.0.0
      # Passthrough: unset unless the host environment or .env provides it.
      - BETTER_AUTH_SECRET
      - BETTER_AUTH_URL
    healthcheck:
      # Without a healthcheck, `up -d --wait` returns as soon as the container is
      # *running*, which for `node server.js` precedes Next.js binding :3000 — a curl
      # fired at that moment races the boot. busybox wget ships in node:24-alpine.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
